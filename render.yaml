services:
  - type: web
    name: newssite
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: version-4/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_SITE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
